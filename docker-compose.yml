services:
  llm-guard:
    build: .
    ports:
      - "8080:8080"
    environment:
      - GUARD_UPSTREAM=https://api.openai.com/v1/chat/completions
      - GUARD_BLOCK=true
      - GUARD_SCAN_RESPONSE=true
      - GUARD_RATE_LIMIT=60
      # Semantic layer: point at the local embedder service below.
      - GUARD_EMBEDDER=http://embedder:8000/check
    depends_on:
      - embedder
    restart: unless-stopped

  # Semantic detection service (local, private).
  embedder:
    build: ./embedder
    ports:
      - "8000:8000"
    restart: unless-stopped
