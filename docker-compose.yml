services:
  llm-guard:
    build: .
    ports:
      - "8080:8080"
    environment:
      # The LLM to forward to. For a fully-local setup, point this at your own
      # model (e.g. Ollama at http://host.docker.internal:11434/v1/chat/completions).
      - GUARD_UPSTREAM=https://api.openai.com/v1/chat/completions
      - GUARD_BLOCK=true
      - GUARD_SCAN_RESPONSE=true
      - GUARD_RATE_LIMIT=60
      # Uncomment to use a custom rules file baked into the image:
      # - GUARD_RULES_FILE=/app/rules.json
      # Uncomment and set to detect system-prompt leaks:
      # - GUARD_SYSTEM_PROMPT_CANARY=your-secret-canary-string
    restart: unless-stopped
